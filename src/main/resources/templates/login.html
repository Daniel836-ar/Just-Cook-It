<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход</title>
    <link rel="stylesheet" th:href="@{/styleLogin.css}">
</head>
<body>
<main class="card">
    <h1>Вход в аккаунт</h1>
    <p class="subtitle">Введите данные, которые указывали при регистрации.</p>

    <!-- Spring Security добавляет ?error при неудачном входе -->
    <div class="alert alert-error" th:if="${param.error}">
        Неверный email или пароль.
    </div>

    <!-- и ?logout после выхода -->
    <div class="alert alert-success" th:if="${param.logout}">
        Вы вышли из аккаунта.
    </div>

    <!-- th:action сам добавит скрытое поле с CSRF-токеном -->
    <form th:action="@{/login}" method="post">
        <div class="field">
            <label for="username">Email</label>
            <input type="email" id="username" name="username"
                   placeholder="you@example.com" required autofocus>
        </div>

        <div class="field">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password"
                   placeholder="Ваш пароль" required>
        </div>

        <button type="submit" class="btn">Войти</button>
    </form>

    <p class="switch">
        Нет аккаунта? <a th:href="@{/registration}">Зарегистрироваться</a>
    </p>
</main>
</body>
</html>
